<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter Notes — youki</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d1117;
    --bg2:     #161b22;
    --bg3:     #21262d;
    --border:  #30363d;
    --text:    #e6edf3;
    --text2:   #8b949e;
    --green:   #39d353;
    --green2:  rgba(57,211,83,0.12);
    --blue:    #79c0ff;
    --orange:  #f0883e;
    --purple:  #d2a8ff;
    --red:     #ff7b72;
    --yellow:  #e3b341;
    --font:    'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem 0;
  }

  #sidebar h1 {
    font-size: 0.7rem;
    color: var(--green);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0 1rem 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.45rem 1rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }

  .nav-item:hover { background: var(--bg3); }
  .nav-item.active {
    border-left-color: var(--green);
    background: var(--green2);
    color: var(--green);
  }

  .nav-num {
    font-size: 0.65rem;
    color: var(--text2);
    min-width: 1.8rem;
  }

  .nav-item.active .nav-num { color: var(--green); }

  .nav-label {
    font-size: 0.72rem;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nav-item.active .nav-label { color: var(--text); }

  .has-notes::after {
    content: '●';
    font-size: 0.5rem;
    color: var(--green);
    margin-left: auto;
    flex-shrink: 0;
  }

  /* ── MAIN ── */
  #main {
    overflow-y: auto;
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .slide-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.8rem;
  }

  .slide-header .num {
    font-size: 0.7rem;
    color: var(--green);
    font-weight: 700;
  }

  .slide-header h2 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  .slide-header .type-badge {
    font-size: 0.6rem;
    padding: 0.15em 0.6em;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-left: auto;
  }

  .badge-demo    { background: rgba(240,136,62,0.2); color: var(--orange); border: 1px solid rgba(240,136,62,0.4); }
  .badge-bridge  { background: rgba(121,192,255,0.1); color: var(--blue);   border: 1px solid rgba(121,192,255,0.3); }
  .badge-content { background: rgba(57,211,83,0.1);  color: var(--green);  border: 1px solid rgba(57,211,83,0.3); }

  /* ── NOTES ── */
  .section-title {
    font-size: 0.65rem;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
  }

  .notes-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .notes-list li {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.6;
    padding-left: 1em;
    border-left: 2px solid var(--border);
  }

  .notes-list li strong { color: var(--yellow); }

  /* ── COMMANDS ── */
  .commands { display: flex; flex-direction: column; gap: 0.8rem; }

  .cmd-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 4px;
    overflow: hidden;
  }

  .cmd-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.4rem 0.8rem;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }

  .cmd-label {
    font-size: 0.65rem;
    color: var(--text2);
    font-style: italic;
  }

  .copy-btn {
    font-family: var(--font);
    font-size: 0.65rem;
    background: var(--green2);
    color: var(--green);
    border: 1px solid rgba(57,211,83,0.35);
    border-radius: 3px;
    padding: 0.2em 0.7em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-btn:hover { background: rgba(57,211,83,0.25); }
  .copy-btn.copied { color: var(--yellow); border-color: var(--yellow); }

  .cmd-body {
    padding: 0.7rem 1rem;
    font-size: 0.82rem;
    line-height: 1.7;
    white-space: pre;
    color: var(--text);
    overflow-x: auto;
  }

  .cmd-body .ps  { color: var(--green); }
  .cmd-body .cm  { color: var(--text2); font-style: italic; }
  .cmd-body .out { color: var(--orange); }

  .expected {
    padding: 0.4rem 1rem 0.6rem;
    font-size: 0.75rem;
    color: var(--text2);
    border-top: 1px solid var(--border);
    font-style: italic;
  }

  /* ── DIVIDER ── */
  hr { border: none; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<nav id="sidebar">
  <h1>// presenter_notes</h1>
</nav>

<main id="main"></main>

<script>
const slides = [
  {
    num: 5, label: "DEMO — conmon process tree", type: "demo",
    notes: [],
    commands: [
      {
        label: "Start a background container",
        cmd: "podman run -d --runtime youki --name demo-conmon alpine sleep 50",
        expected: "<container ID>"
      },
      {
        label: "Show the full process tree under conmon",
        cmd: "pstree -p $(pgrep -n conmon)",
        expected: "conmon(<PID>)---sleep(<PID>)  ← conmon holds the container alive"
      },
      {
        label: "Cleanup",
        cmd: "podman rm -f demo-conmon",
        expected: "demo-conmon"
      },
    ]
  },
  {
    num: 8, label: "DEMO — Primitives diagram", type: "demo",
    notes: [],
    commands: [
      {
        label: "— NAMESPACES — Container sees PID 1 as its own process (isolated PID namespace)",
        cmd: "podman run --runtime youki --rm alpine ps aux",
        expected: "PID   USER     TIME  COMMAND\n    1 root      0:00 ps aux\n(only one process — container is isolated from host)"
      },
      {
        label: "Host sees many processes — compare with container",
        cmd: "ps aux | head -10",
        expected: "(host processes — much more than inside the container)"
      },
      {
        label: "Container has its own hostname (UTS namespace)",
        cmd: "podman run --runtime youki --rm alpine hostname",
        expected: "(random container ID — not the host hostname)"
      },
      {
        label: "Host hostname for comparison",
        cmd: "hostname",
        expected: "(your host machine name)"
      },
      {
        label: "— CGROUPS — Show the memory limit enforced inside the container",
        cmd: "podman run --rm --name demo-cgroups-limit --runtime youki --memory=16m alpine sh -c 'cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes'",
        expected: "16777216  ← 16MB enforced by cgroups"
      },
      {
        label: "Try to allocate more than the limit — kernel OOM-kills the process",
        cmd: "podman run --name demo-cgroups --runtime youki --memory=16m --memory-swap=16m alpine sh -c 'a=$(head -c 33554432 /dev/urandom); echo ${#a}'",
        expected: "Killed  ← kernel OOM killer terminated the process"
      },
      {
        label: "Show exit code 137 — proof of OOM kill (128 + SIGKILL 9 = 137)",
        cmd: "podman ps -a --filter name=demo-cgroups",
        expected: "Exited (137)  ← 128 + SIGKILL(9) = OOM kill"
      },
      {
        label: "Confirm OOMKilled flag via inspect",
        cmd: "podman inspect demo-cgroups |less",
        expected: "true"
      },
      {
        label: "Cleanup",
        cmd: "podman rm demo-cgroups",
        expected: "demo-cgroups"
      },
      {
        label: "— SECCOMP — date -s blocked by default seccomp profile (clock_settime syscall)",
        cmd: "podman run --runtime youki --rm alpine date -s \"10:00:00\"",
        expected: "date: can't set date: Operation not permitted  ← seccomp blocking clock_settime"
      },
    ]
  },
  {
    num: 12, label: "DEMO — config.json", type: "demo",
    notes: [],
    commands: [
      {
        label: "Step 1 — start a container in the background so config.json persists on disk",
        cmd: "podman run -d --runtime youki --name demo-config alpine sleep 300",
        expected: "<container ID>"
      },
      {
        label: "Step 2 — find where config.json was created",
        cmd: "podman inspect demo-config --format '{{.OCIConfigPath}}'",
        expected: "/run/containers/storage/overlay-containers/<ID>/userdata/config.json"
      },
      {
        label: "Step 3 — pretty print the linux section (namespaces + cgroups + seccomp)",
        cmd: "cat $(podman inspect demo-config --format '{{.OCIConfigPath}}') | python3 -c \"import json,sys; d=json.load(sys.stdin); print(json.dumps(d['linux'], indent=2))\" | less",
        expected: "full linux section — namespaces, cgroupsPath, resources, seccomp"
      },
      {
        label: "Cleanup",
        cmd: "podman rm -f demo-config",
        expected: "demo-config"
      },
    ]
  },
  {
    num: 14, label: "DEMO — strace syscalls", type: "demo",
    notes: [
      "<strong>Goal:</strong> show that youki is just syscalls — no magic, no daemon. The kernel does the work.",
    ],
    commands: [
      {
        label: "Run container and trace the 4 key syscalls",
        cmd: `sudo strace -f \\
    -e trace=clone,mount,pivot_root,execve \\
    podman run --runtime youki --rm alpine echo hi`,
        expected: "[pid XXXX] clone(flags=CLONE_NEWPID|CLONE_NEWNS|CLONE_NEWNET…)\n[pid XXXX] mount(\"overlay\", …)\n[pid XXXX] pivot_root(\".\", \".\")\n[pid XXXX] execve(\"/bin/echo\", …)\nhi"
      },
      {
        label: "Filter only the lines that matter (cleaner output)",
        cmd: `sudo strace -f -e trace=clone,mount,pivot_root,execve \\
    podman run --runtime youki --rm alpine echo hi 2>&1 \\
    | grep -E 'clone|mount|pivot_root|execve|^hi'`,
        expected: "clone(…) = <PID>\npivot_root(\".\", \".\") = 0\nexecve(\"/bin/echo\", …) = 0\nhi"
      },
    ]
  },
  {
    num: 18, label: "DEMO Setup", type: "demo",
    notes: [],
    commands: [
      {
        label: "Quick sanity check — all three runtimes installed",
        cmd: "which youki runc crun",
      }
    ]
  },
  {
    num: 19, label: "DEMO — Run & Measure", type: "demo",
    notes: [],
    commands: [
      {
        label: "Benchmark youki — 50 containers startup time",
        cmd: `time for i in $(seq 1 50); do
  podman run --runtime youki --rm alpine echo hi
done`,
      },
      {
        label: "Benchmark runc — 50 containers startup time",
        cmd: `time for i in $(seq 1 50); do
  podman run --runtime runc --rm alpine echo hi
done`,
      },
      {
        label: "Benchmark crun — 50 containers startup time",
        cmd: `time for i in $(seq 1 50); do
  podman run --runtime crun --rm alpine echo hi
done`,
      },
    ]
  },
  {
    num: 20, label: "DEMO — Expected Results", type: "demo",
    notes: [],
    commands: []
  },
];

// ── Build sidebar + main ──
const sidebar = document.getElementById('sidebar');
const main    = document.getElementById('main');

let activeNum = slides[0]?.num ?? 1;

function render(slide) {
  main.innerHTML = '';
  const slidePosition = slides.findIndex(s => s.num === slide.num) + 1;

  // Header
  const header = document.createElement('div');
  header.className = 'slide-header';
  header.innerHTML = `
    <span class="num">${String(slidePosition).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span>
    <h2>${slide.label}</h2>
    <span class="type-badge badge-${slide.type}">${slide.type}</span>
  `;
  main.appendChild(header);

  // Notes
  if (slide.notes.length) {
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="section-title">// talking points</div>`;
    const ul = document.createElement('ul');
    ul.className = 'notes-list';
    slide.notes.forEach(n => {
      const li = document.createElement('li');
      li.innerHTML = n;
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    main.appendChild(sec);
  }

  // Commands
  if (slide.commands.length) {
    const hr = document.createElement('hr');
    main.appendChild(hr);

    const sec = document.createElement('div');
    sec.innerHTML = `<div class="section-title" style="margin-bottom:.6rem">// commands</div>`;
    const cmds = document.createElement('div');
    cmds.className = 'commands';

    slide.commands.forEach(c => {
      const block = document.createElement('div');
      block.className = 'cmd-block';

      const hdr = document.createElement('div');
      hdr.className = 'cmd-header';
      hdr.innerHTML = `<span class="cmd-label">${c.label}</span>`;

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(c.cmd).then(() => {
          btn.textContent = 'copied ✓';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'copy';
            btn.classList.remove('copied');
          }, 1800);
        });
      });
      hdr.appendChild(btn);
      block.appendChild(hdr);

      const body = document.createElement('div');
      body.className = 'cmd-body';
      // Colorize $ prompts and # comments
      body.innerHTML = c.cmd
        .replace(/^(\$)/gm, '<span class="ps">$</span>')
        .replace(/^(#.*)$/gm, '<span class="cm">$1</span>');
      block.appendChild(body);

      if (c.expected) {
        const exp = document.createElement('div');
        exp.className = 'expected';
        exp.textContent = '→ expected: ' + c.expected;
        block.appendChild(exp);
      }

      cmds.appendChild(block);
    });
    sec.appendChild(cmds);
    main.appendChild(sec);
  }
}

function activate(num) {
  activeNum = num;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.num) === num);
  });
  const slide = slides.find(s => s.num === num);
  if (slide) render(slide);
  main.scrollTop = 0;
}

// Build nav
slides.forEach(slide => {
  const item = document.createElement('div');
  item.className = 'nav-item' + (slide.commands.length || slide.notes.length > 2 ? ' has-notes' : '');
  item.dataset.num = slide.num;
  item.innerHTML = `
    <span class="nav-num">${String(slide.num).padStart(2,'0')}</span>
    <span class="nav-label">${slide.label}</span>
  `;
  item.addEventListener('click', () => activate(slide.num));
  sidebar.appendChild(item);
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    const next = slides.find(s => s.num === activeNum + 1);
    if (next) activate(next.num);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    const prev = slides.find(s => s.num === activeNum - 1);
    if (prev) activate(prev.num);
  }
});

activate(1);
</script>
</body>
</html>
